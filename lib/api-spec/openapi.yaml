openapi: 3.1.0
info:
  # Do not change the title, if the title changes, the import paths will be broken
  title: Api
  version: 0.1.0
  description: API specification
servers:
  - url: /api
    description: Base API path
tags:
  - name: health
    description: Health operations
paths:
  /trips/{tripId}/routes:
    parameters:
      - { $ref: "#/components/parameters/TripId" }
    get:
      operationId: getTripRoutes
      summary: Estimate road geometry from the owned saved itinerary; provider failures do not alter stops
      security: [{ sessionCookie: [] }]
      responses:
        "200":
          description: Routing result including per-section availability
          content:
            application/json:
              schema: { $ref: "#/components/schemas/TripRouting" }
        "400": { $ref: "#/components/responses/InvalidTripRequest" }
        "401": { description: Sign-in required }
        "404": { description: Trip not found or not owned }
  /trips/{tripId}/stops:
    parameters:
      - { $ref: "#/components/parameters/TripId" }
    get:
      operationId: listStops
      summary: List owned trip stops in itinerary order
      security: [{ sessionCookie: [] }]
      responses:
        "200": { $ref: "#/components/responses/StopList" }
        "400": { $ref: "#/components/responses/InvalidTripRequest" }
        "401": { description: Sign-in required }
        "404": { description: Trip not found or not owned }
    post:
      operationId: createStop
      summary: Insert a stop, appending if sortOrder is omitted
      security: [{ sessionCookie: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/StopInput" }
      responses:
        "201":
          description: Created stop
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Stop" }
        "400": { $ref: "#/components/responses/InvalidTripRequest" }
        "401": { description: Sign-in required }
        "404": { description: Trip not found or not owned }
        "413": { description: Request too large }
        "415": { description: Send application/json }
  /trips/{tripId}/stops/order:
    parameters:
      - { $ref: "#/components/parameters/TripId" }
    put:
      operationId: reorderStops
      summary: Atomically replace itinerary order with an exact permutation of current stop IDs
      security: [{ sessionCookie: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/StopOrderInput" }
      responses:
        "200": { $ref: "#/components/responses/StopList" }
        "400": { $ref: "#/components/responses/InvalidTripRequest" }
        "401": { description: Sign-in required }
        "404": { description: Trip not found or not owned }
        "409": { description: Stop set changed; reload before reordering }
        "413": { description: Request too large }
        "415": { description: Send application/json }
  /trips/{tripId}/stops/{stopId}:
    parameters:
      - { $ref: "#/components/parameters/TripId" }
      - name: stopId
        in: path
        required: true
        schema: { type: string, format: uuid }
    get:
      operationId: getStop
      summary: Get one stop in an owned trip
      security: [{ sessionCookie: [] }]
      responses:
        "200": { $ref: "#/components/responses/OneStop" }
        "400": { $ref: "#/components/responses/InvalidTripRequest" }
        "401": { description: Sign-in required }
        "404": { description: Stop or parent trip not found or not owned }
    put:
      operationId: updateStop
      summary: Replace editable stop fields and optionally move its position
      security: [{ sessionCookie: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/StopInput" }
      responses:
        "200": { $ref: "#/components/responses/OneStop" }
        "400": { $ref: "#/components/responses/InvalidTripRequest" }
        "401": { description: Sign-in required }
        "404": { description: Stop or parent trip not found or not owned }
        "413": { description: Request too large }
        "415": { description: Send application/json }
    delete:
      operationId: deleteStop
      summary: Delete a stop and compact its itinerary positions
      security: [{ sessionCookie: [] }]
      responses:
        "204": { description: Deleted }
        "400": { $ref: "#/components/responses/InvalidTripRequest" }
        "401": { description: Sign-in required }
        "404": { description: Stop or parent trip not found or not owned }
  /trips/{tripId}/stops/{stopId}/stay:
    parameters:
      - { $ref: "#/components/parameters/TripId" }
      - name: stopId
        in: path
        required: true
        schema: { type: string, format: uuid }
    post:
      operationId: createStay
      summary: Add the single accommodation stay for an owned stop
      security: [{ sessionCookie: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/StayInput" }
      responses:
        "201":
          description: Created stay
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Stay" }
        "400": { $ref: "#/components/responses/InvalidTripRequest" }
        "401": { description: Sign-in required }
        "404": { description: Stop or parent trip not found or not owned }
        "409": { description: This stop already has an accommodation }
        "413": { description: Request too large }
        "415": { description: Send application/json }
    put:
      operationId: updateStay
      summary: Replace an existing stay on an owned stop
      security: [{ sessionCookie: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/StayInput" }
      responses:
        "200":
          description: Updated stay
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Stay" }
        "400": { $ref: "#/components/responses/InvalidTripRequest" }
        "401": { description: Sign-in required }
        "404": { description: Stay or parent stop/trip missing or not owned }
        "413": { description: Request too large }
        "415": { description: Send application/json }
    delete:
      operationId: deleteStay
      summary: Delete only the stay for an owned stop
      security: [{ sessionCookie: [] }]
      responses:
        "204": { description: Deleted; the stop and trip remain }
        "401": { description: Sign-in required }
        "404": { description: Stay or parent stop/trip missing or not owned }
  /trips:
    get:
      operationId: listTrips
      summary: List only the current user's trips, newest start date first
      security: [{ sessionCookie: [] }]
      responses:
        "200":
          description: Own trips
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/Trip" }
        "401": { description: Sign-in required }
        "503": { description: Account synchronization unavailable }
    post:
      operationId: createTrip
      summary: Create a trip for the current user
      security: [{ sessionCookie: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/TripInput" }
      responses:
        "201":
          description: Created trip
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Trip" }
        "400": { $ref: "#/components/responses/InvalidTripRequest" }
        "413": { description: Request body exceeds 100 KiB }
        "415": { description: Send application/json }
        "401": { description: Sign-in required }
        "503": { description: Account synchronization unavailable }
  /trips/{id}:
    parameters:
      - name: id
        in: path
        required: true
        schema: { type: string, format: uuid }
    get:
      operationId: getTrip
      summary: Open one owned trip
      security: [{ sessionCookie: [] }]
      responses:
        "200":
          description: Own trip
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Trip" }
        "400": { description: Invalid ID }
        "401": { description: Sign-in required }
        "404": { description: Not found or not owned }
        "503": { description: Account synchronization unavailable }
    put:
      operationId: updateTrip
      summary: Replace editable fields of one owned trip
      security: [{ sessionCookie: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/TripInput" }
      responses:
        "200":
          description: Updated own trip
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Trip" }
        "400": { $ref: "#/components/responses/InvalidTripRequest" }
        "413": { description: Request body exceeds 100 KiB }
        "415": { description: Send application/json }
        "401": { description: Sign-in required }
        "404": { description: Not found or not owned }
        "503": { description: Account synchronization unavailable }
    delete:
      operationId: deleteTrip
      summary: Delete one owned trip and its dependent records
      security: [{ sessionCookie: [] }]
      responses:
        "204": { description: Deleted }
        "400": { description: Invalid ID }
        "401": { description: Sign-in required }
        "404": { description: Not found or not owned }
        "503": { description: Account synchronization unavailable }
  /auth/me:
    get:
      operationId: getCurrentUser
      summary: Resolve the signed-in Clerk session to an internal account
      security:
        - sessionCookie: []
      responses:
        "200":
          description: Current internal user (synchronized from Clerk)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CurrentUser"
        "401":
          description: No valid session
        "503":
          description: Account synchronization temporarily unavailable
  /healthz:
    get:
      operationId: healthCheck
      tags: [health]
      summary: Health check
      description: Returns server health status
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"
components:
  parameters:
    TripId:
      name: tripId
      in: path
      required: true
      schema: { type: string, format: uuid }
  responses:
    StopList:
      description: Stops ordered by sortOrder then UUID
      content:
        application/json:
          schema:
            type: array
            items: { $ref: "#/components/schemas/Stop" }
    OneStop:
      description: Owned stop
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Stop" }
    InvalidTripRequest:
      description: Invalid input; known fields have actionable messages; root errors use formErrors
      content:
        application/json:
          schema: { $ref: "#/components/schemas/TripRequestError" }
  securitySchemes:
    sessionCookie:
      type: apiKey
      in: cookie
      name: __session
  schemas:
    TripRouting:
      type: object
      required: [tripId, stopRevision, segments]
      properties:
        tripId: { type: string, format: uuid }
        stopRevision: { type: string }
        segments:
          type: array
          items: { $ref: "#/components/schemas/DrivingRoute" }
    DrivingRoute:
      type: object
      required: [stopIds, status, message, coordinates]
      properties:
        stopIds:
          type: array
          items: { type: string, format: uuid }
        status:
          type: string
          enum: [ready, missing_key, unreachable, timeout, rate_limited, provider_error, invalid_response, provider_limit, busy]
        message: { type: string }
        coordinates:
          description: Validated GeoJSON longitude-latitude pairs, not Leaflet latitude-longitude
          type: array
          items:
            type: array
            minItems: 2
            maxItems: 2
            items: { type: number }
        distanceMeters: { type: number, minimum: 0 }
        durationSeconds: { type: number, minimum: 0 }
        retryAfterSeconds: { type: integer, minimum: 0 }
    StopOrderInput:
      type: object
      additionalProperties: false
      required: [stopIds]
      properties:
        stopIds:
          type: array
          uniqueItems: true
          items: { type: string, format: uuid }
    StopInput:
      type: object
      additionalProperties: false
      required: [name, latitude, longitude]
      properties:
        name: { type: string, minLength: 1, maxLength: 200 }
        latitude: { type: number, minimum: -90, maximum: 90, description: Rounded to six decimal places on save }
        longitude: { type: number, minimum: -180, maximum: 180, description: Rounded to six decimal places on save }
        sortOrder: { type: integer, minimum: 0, maximum: 2147483647 }
        visitDate: { type: string, format: date, nullable: true }
        stopType: { type: string, maxLength: 100, nullable: true }
        transportFromPrevious: { type: string, enum: [Driving, Flying, Other], nullable: true }
        notes: { type: string, maxLength: 20000, nullable: true }
    Stop:
      type: object
      required: [id, tripId, name, latitude, longitude, sortOrder, visitDate, stopType, transportFromPrevious, notes, stay]
      properties:
        id: { type: string, format: uuid }
        tripId: { type: string, format: uuid }
        name: { type: string }
        latitude: { type: number }
        longitude: { type: number }
        sortOrder: { type: integer }
        visitDate: { type: string, format: date, nullable: true }
        stopType: { type: string, nullable: true }
        transportFromPrevious: { type: string, enum: [Driving, Flying, Other], nullable: true }
        notes: { type: string, nullable: true }
        stay:
          oneOf:
            - { $ref: "#/components/schemas/Stay" }
            - { type: "null" }
    StayInput:
      type: object
      additionalProperties: false
      required: [accommodationType, checkIn, checkOut]
      properties:
        accommodationType: { type: string, enum: [Hotel, Campground, Vacation Rental, Other] }
        checkIn: { type: string, format: date }
        checkOut: { type: string, format: date }
        rating: { type: integer, minimum: 1, maximum: 5, nullable: true }
        notes: { type: string, nullable: true }
    Stay:
      type: object
      required: [id, stopId, accommodationType, checkIn, checkOut, rating, notes]
      properties:
        id: { type: string, format: uuid }
        stopId: { type: string, format: uuid }
        accommodationType: { type: string, enum: [Hotel, Campground, Vacation Rental, Other] }
        checkIn: { type: string, format: date }
        checkOut: { type: string, format: date }
        rating: { type: integer, minimum: 1, maximum: 5, nullable: true }
        notes: { type: string, nullable: true }
    TripRequestError:
      type: object
      required: [error]
      properties:
        error: { type: string }
        fields:
          type: object
          additionalProperties:
            type: array
            items: { type: string }
        formErrors:
          type: array
          items: { type: string }
    TripInput:
      type: object
      additionalProperties: false
      required: [title, startDate, endDate]
      properties:
        title: { type: string, minLength: 1, maxLength: 200 }
        startDate: { type: string, format: date }
        endDate: { type: string, format: date }
        destinationRegion: { type: [string, "null"], maxLength: 200 }
        tripType: { type: [string, "null"], maxLength: 100 }
        notes: { type: [string, "null"], maxLength: 20000 }
    Trip:
      type: object
      required: [id, title, startDate, endDate, destinationRegion, tripType, notes, createdAt]
      properties:
        id: { type: string, format: uuid }
        title: { type: string }
        startDate: { type: string, format: date }
        endDate: { type: string, format: date }
        destinationRegion: { type: [string, "null"] }
        tripType: { type: [string, "null"] }
        notes: { type: [string, "null"] }
        createdAt: { type: string, format: date-time }
    CurrentUser:
      type: object
      required: [id, email, createdAt]
      properties:
        id:
          type: string
          format: uuid
        email:
          type: string
          format: email
        createdAt:
          type: string
          format: date-time
    HealthStatus:
      type: object
      properties:
        status:
          type: string
      required:
        - status

